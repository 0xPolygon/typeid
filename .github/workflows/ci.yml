name: CI

on:
    pull_request:
    push:
        branches: [master]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
            - run: make test vet
